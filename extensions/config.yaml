- extension: subagent
  enabled: true
  subagents:
    agent:
      - provider: github-copilot
        model: gpt-5.4-mini
        thinking: medium
    designer:
      - provider: github-copilot
        model: claude-sonnet-4.6
        thinking: medium
    reviewer:
      - provider: github-copilot
        model: gpt-5.4-mini
        thinking: medium

- extension: tools
  enabled: true
  tools:
    grep: true
    glob: true
    list: true
    todo_write: true
    question: false
    questionnaire: false
    web_fetch: false
    find_docs: true

- extension: handoff
  enabled: true

- extension: notify
  enabled: true

- extension: minimal-mode
  enabled: true

- extension: footer-badges
  enabled: true

- extension: git-guardrails
  enabled: false

- extension: refine-my-prompt
  enabled: true
  model:
    provider: opencode-go
    model: qwen3.6-plus
    thinking: medium
